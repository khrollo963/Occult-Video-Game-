name: Export Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write leaderboard config for Web export
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p config
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Supabase secrets not set — copying example config (leaderboard disabled in build)"
            cp config/leaderboard.cfg.example config/leaderboard.cfg
          else
            printf '%s\n' '[supabase]' "url=\"$SUPABASE_URL\"" "anon_key=\"$SUPABASE_ANON_KEY\"" > config/leaderboard.cfg
          fi

      - name: Run smoke tests
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip"
          unzip -q godot.zip
          GODOT=$(find . -maxdepth 1 -name 'Godot_v4.6.3-stable_linux.x86_64' -type f | head -1)
          chmod +x "$GODOT"
          "$GODOT" --headless --path . --import --quit
          "$GODOT" --headless --script tests/run_smoke.gd

      - name: Export Godot project to Web
        id: export
        uses: firebelley/godot-export@v7.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          relative_project_path: ./
          cache: true
          presets_to_export: Web
          use_preset_export_path: true
          verbose: true

      - name: Prepare Pages artifact directory
        run: |
          if [ ! -f export/web/index.html ]; then
            echo "export/web not found; copying from action build directory"
            mkdir -p export/web
            cp -a "${{ steps.export.outputs.build_directory }}/Web/." export/web/
          fi
          test -f export/web/index.html
          ls -la export/web/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: export/web

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
